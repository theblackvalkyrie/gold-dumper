<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Gold vs Currency</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            padding: 10px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 20px; }
        .header {
            text-align: center; padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 15px; margin-bottom: 20px;
        }
        .header h1 { font-size: 28px; color: #FFD700; }
        .market-status {
            font-size: 11px; margin-top: 5px; padding: 5px 10px;
            border-radius: 5px; display: inline-block;
            background: rgba(0, 255, 0, 0.2); color: #00FF00;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px; padding: 20px; margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-title {
            font-size: 16px; font-weight: bold; margin-bottom: 15px;
            color: #00FFFF; text-transform: uppercase;
        }
        .currency-selector {
            width: 100%; padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.5);
            border-radius: 8px; background: rgba(0, 0, 0, 0.3);
            color: #fff; font-size: 16px;
        }
        .price-display { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .price-box {
            background: rgba(0, 0, 0, 0.3); padding: 20px;
            border-radius: 10px; text-align: center;
        }
        .price-label { font-size: 12px; color: #999; margin-bottom: 8px; }
        .price-value { font-size: 32px; font-weight: bold; color: #FFD700; }
        .price-change { font-size: 14px; margin-top: 8px; font-weight: bold; }
        .positive { color: #00FF00; }
        .negative { color: #FF4444; }
        .chart-container {
            background: rgba(0, 0, 0, 0.3); padding: 20px;
            border-radius: 10px; height: 400px; position: relative;
        }
        .comparison-box {
            background: linear-gradient(135deg, rgba(100, 149, 237, 0.2) 0%, rgba(65, 105, 225, 0.2) 100%);
            border: 2px solid rgba(100, 149, 237, 0.5);
            padding: 20px; border-radius: 10px; margin-bottom: 15px;
        }
        .comparison-title { font-size: 18px; font-weight: bold; color: #6495ED; margin-bottom: 15px; text-align: center; }
        .comparison-stat {
            display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-label { color: #ccc; font-size: 14px; }
        .stat-value { font-weight: bold; font-size: 16px; }
        .btn {
            width: 100%; padding: 15px; border: none;
            border-radius: 10px; font-size: 16px; font-weight: bold;
            cursor: pointer; text-transform: uppercase;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .loading { text-align: center; padding: 40px; color: #FFD700; }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #FFD700;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .legend {
            display: flex; justify-content: center; gap: 20px; margin-top: 10px;
        }
        .legend-item {
            display: flex; align-items: center; gap: 8px; font-size: 12px;
        }
        .legend-color {
            width: 20px; height: 3px; border-radius: 2px;
        }
        @media (max-width: 600px) {
            .price-display { grid-template-columns: 1fr; }
            .chart-container { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 GOLD vs CURRENCY TRACKER</h1>
            <div style="font-size: 12px; margin-top: 5px; color: #FFD700;">Real-Time Currency Impact Analysis</div>
            <div id="marketStatus" class="market-status">● LOADING...</div>
        </div>

        <div class="card">
            <div class="card-title">🌍 Select Currency</div>
            <select id="currencySelect" class="currency-selector">
                <option value="CAD">🇨🇦 Canadian Dollar (CAD)</option>
                <option value="EUR">🇪🇺 Euro (EUR)</option>
                <option value="GBP">🇬🇧 British Pound (GBP)</option>
                <option value="JPY">🇯🇵 Japanese Yen (JPY)</option>
                <option value="AUD">🇦🇺 Australian Dollar (AUD)</option>
                <option value="CHF">🇨🇭 Swiss Franc (CHF)</option>
                <option value="CNY">🇨🇳 Chinese Yuan (CNY)</option>
                <option value="HUF">🇭🇺 Hungarian Forint (HUF)</option>
                <option value="INR">🇮🇳 Indian Rupee (INR)</option>
                <option value="MXN">🇲🇽 Mexican Peso (MXN)</option>
                <option value="BRL">🇧🇷 Brazilian Real (BRL)</option>
                <option value="KRW">🇰🇷 South Korean Won (KRW)</option>
                <option value="SGD">🇸🇬 Singapore Dollar (SGD)</option>
                <option value="HKD">🇭🇰 Hong Kong Dollar (HKD)</option>
                <option value="NOK">🇳🇴 Norwegian Krone (NOK)</option>
                <option value="SEK">🇸🇪 Swedish Krona (SEK)</option>
                <option value="DKK">🇩🇰 Danish Krone (DKK)</option>
                <option value="ZAR">🇿🇦 South African Rand (ZAR)</option>
                <option value="NZD">🇳🇿 New Zealand Dollar (NZD)</option>
                <option value="TRY">🇹🇷 Turkish Lira (TRY)</option>
                <option value="PLN">🇵🇱 Polish Zloty (PLN)</option>
                <option value="CZK">🇨🇿 Czech Koruna (CZK)</option>
            </select>
        </div>

        <div id="loadingIndicator" class="loading">
            <div class="spinner"></div>
            <div>Loading last 7 days...</div>
        </div>

        <div id="mainContent" style="display: none;">
            <div class="card">
                <div class="card-title">📊 Current Prices</div>
                <div class="price-display">
                    <div class="price-box">
                        <div class="price-label">Gold (USD/oz)</div>
                        <div class="price-value" id="goldUSD">$0.00</div>
                        <div class="price-change" id="goldChange">--</div>
                    </div>
                    <div class="price-box">
                        <div class="price-label">Gold (<span id="currencyLabel">CAD</span>/oz)</div>
                        <div class="price-value" id="goldLocal">$0.00</div>
                        <div class="price-change" id="localChange">--</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">📈 7-Day Historical Chart</div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color" style="background: #FFD700;"></div>
                        <span>Gold in USD</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color" style="background: #00BFFF;"></div>
                        <span id="localLegend">Gold in CAD</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="comparison-box">
                    <div class="comparison-title">💱 Currency Impact</div>
                    <div class="comparison-stat">
                        <span class="stat-label">Exchange Rate:</span>
                        <span class="stat-value" id="exchangeRate">0.0000</span>
                    </div>
                    <div class="comparison-stat">
                        <span class="stat-label">Currency Impact:</span>
                        <span class="stat-value" id="impactAnalysis">--</span>
                    </div>
                </div>
            </div>

            <button class="btn" id="refreshBtn">🔄 Refresh</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        let chart = null;
        let selectedCurrency = 'CAD';
        let priceHistory = {timestamps: [], goldUSD: [], goldLocal: []};
        let currentData = {goldUSD: 0, exchangeRate: 0, goldLocal: 0, baselineGoldUSD: 0, baselineRate: 0};

        console.log('=== GOLD TRACKER FINAL ===');

        document.getElementById('currencySelect').addEventListener('change', async (e) => {
            selectedCurrency = e.target.value;
            console.log('Currency changed to:', selectedCurrency);
            
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('mainContent').style.display = 'none';
            
            // Reset data
            priceHistory = {timestamps: [], goldUSD: [], goldLocal: []};
            currentData = {goldUSD: 0, exchangeRate: 0, goldLocal: 0, baselineGoldUSD: 0, baselineRate: 0};
            
            await loadData();
        });

        document.getElementById('refreshBtn').addEventListener('click', async () => {
            const btn = document.getElementById('refreshBtn');
            btn.textContent = '🔄 Refreshing...';
            btn.disabled = true;
            
            // Reset data before refresh
            priceHistory = {timestamps: [], goldUSD: [], goldLocal: []};
            
            await loadData();
            
            btn.textContent = '🔄 Refresh';
            btn.disabled = false;
        });

        async function loadData() {
            try {
                console.log('Loading data for:', selectedCurrency);
                
                // Get last 7 days of gold from FreeGoldAPI JSON
                const goldResp = await fetch('https://freegoldapi.com/data/latest.json', {
                    signal: AbortSignal.timeout(10000)
                });
                const allGold = await goldResp.json();
                
                // Get last 7 days only
                const last7 = allGold.slice(-7);
                console.log('Gold data:', last7.length, 'days');
                
                // Get forex for those 7 days
                const today = new Date().toISOString().split('T')[0];
                const sevenDaysAgo = new Date();
                sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
                const start = sevenDaysAgo.toISOString().split('T')[0];
                
                const forexUrl = `https://api.frankfurter.dev/v1/${start}..${today}?base=USD&symbols=${selectedCurrency}`;
                console.log('Fetching:', forexUrl);
                
                const forexResp = await fetch(forexUrl, {
                    signal: AbortSignal.timeout(10000)
                });
                const forexData = await forexResp.json();
                
                console.log('Forex data:', Object.keys(forexData.rates).length, 'days for', selectedCurrency);
                
                // Merge data
                for (const goldPoint of last7) {
                    const date = goldPoint.date;
                    const rate = forexData.rates[date]?.[selectedCurrency];
                    if (rate && goldPoint.price > 0) {
                        priceHistory.timestamps.push(new Date(date).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}));
                        priceHistory.goldUSD.push(goldPoint.price);
                        priceHistory.goldLocal.push(goldPoint.price * rate);
                    }
                }
                
                console.log('Merged data points:', priceHistory.timestamps.length);
                console.log('USD prices:', priceHistory.goldUSD);
                console.log('Local prices:', priceHistory.goldLocal);
                
                if (priceHistory.timestamps.length > 0) {
                    currentData.goldUSD = priceHistory.goldUSD[priceHistory.goldUSD.length - 1];
                    currentData.exchangeRate = priceHistory.goldLocal[priceHistory.goldLocal.length - 1] / currentData.goldUSD;
                    currentData.goldLocal = currentData.goldUSD * currentData.exchangeRate;
                    currentData.baselineGoldUSD = priceHistory.goldUSD[0];
                    currentData.baselineRate = priceHistory.goldLocal[0] / priceHistory.goldUSD[0];
                }
                
                updateUI();
                updateChart();
                
                document.getElementById('loadingIndicator').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('marketStatus').textContent = '● LIVE 24/7';
                document.getElementById('marketStatus').style.background = 'rgba(0, 255, 0, 0.2)';
                document.getElementById('marketStatus').style.color = '#00FF00';
                
                console.log('=== DATA LOADED SUCCESSFULLY ===');
                
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Failed to load data. Please try again.');
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        function updateUI() {
            document.getElementById('currencyLabel').textContent = selectedCurrency;
            document.getElementById('localLegend').textContent = `Gold in ${selectedCurrency}`;
            document.getElementById('goldUSD').textContent = `$${currentData.goldUSD.toFixed(2)}`;
            document.getElementById('goldLocal').textContent = `${getCurrencySymbol()}${currentData.goldLocal.toFixed(2)}`;
            
            const goldChange = currentData.goldUSD - currentData.baselineGoldUSD;
            const goldChangePct = (goldChange / currentData.baselineGoldUSD) * 100;
            updateChangeDisplay('goldChange', goldChange, goldChangePct);
            
            const localChange = currentData.goldLocal - (currentData.baselineGoldUSD * currentData.baselineRate);
            const localChangePct = (localChange / (currentData.baselineGoldUSD * currentData.baselineRate)) * 100;
            updateChangeDisplay('localChange', localChange, localChangePct);
            
            document.getElementById('exchangeRate').textContent = currentData.exchangeRate.toFixed(4);
            
            const impactDiff = localChangePct - goldChangePct;
            const impactEl = document.getElementById('impactAnalysis');
            if (Math.abs(impactDiff) > 0.5) {
                impactEl.innerHTML = impactDiff > 0 ? 
                    `<span class="positive">+${impactDiff.toFixed(2)}%</span>` : 
                    `<span class="negative">${impactDiff.toFixed(2)}%</span>`;
            } else {
                impactEl.textContent = 'Minimal';
            }
        }

        function updateChangeDisplay(id, change, pct) {
            const el = document.getElementById(id);
            const sign = change >= 0 ? '+' : '';
            const cls = change >= 0 ? 'positive' : 'negative';
            el.innerHTML = `<span class="${cls}">${sign}$${change.toFixed(2)} (${sign}${pct.toFixed(2)}%)</span>`;
        }

        function getCurrencySymbol() {
            const symbols = {
                'CAD': 'C$', 'EUR': '€', 'GBP': '£', 'JPY': '¥', 'AUD': 'A$',
                'CHF': 'CHF', 'CNY': '¥', 'HUF': 'Ft', 'INR': '₹', 'MXN': '$', 
                'BRL': 'R$', 'KRW': '₩', 'SGD': 'S$', 'HKD': 'HK$', 
                'NOK': 'kr', 'SEK': 'kr', 'DKK': 'kr', 'ZAR': 'R', 'NZD': 'NZ$', 
                'TRY': '₺', 'PLN': 'zł', 'CZK': 'Kč'
            };
            return symbols[selectedCurrency] || selectedCurrency + ' ';
        }

        function updateChart() {
            console.log('Updating chart with data:', priceHistory.timestamps.length, 'points');
            
            const ctx = document.getElementById('priceChart').getContext('2d');
            
            // DESTROY old chart before creating new one
            if (chart) {
                console.log('Destroying old chart');
                chart.destroy();
                chart = null;
            }
            
            const allValues = [...priceHistory.goldUSD, ...priceHistory.goldLocal];
            const minVal = Math.min(...allValues) * 0.995;
            const maxVal = Math.max(...allValues) * 1.005;
            
            console.log('Creating new chart for', selectedCurrency);
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: priceHistory.timestamps,
                    datasets: [
                        {
                            label: 'Gold in USD',
                            data: priceHistory.goldUSD,
                            borderColor: '#FFD700',
                            backgroundColor: 'rgba(255, 215, 0, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 3,
                            pointBackgroundColor: '#FFD700'
                        },
                        {
                            label: `Gold in ${selectedCurrency}`,
                            data: priceHistory.goldLocal,
                            borderColor: '#00BFFF',
                            backgroundColor: 'rgba(0, 191, 255, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            pointRadius: 3,
                            pointBackgroundColor: '#00BFFF'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {display: false},
                        tooltip: {
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            titleColor: '#FFD700',
                            bodyColor: '#fff'
                        }
                    },
                    scales: {
                        x: {
                            grid: {color: 'rgba(255,255,255,0.1)'},
                            ticks: {color: '#999'}
                        },
                        y: {
                            min: minVal,
                            max: maxVal,
                            grid: {color: 'rgba(255,255,255,0.1)'},
                            ticks: {
                                color: '#FFD700',
                                callback: v => '$' + v.toFixed(0)
                            }
                        }
                    }
                }
            });
            
            console.log('Chart created successfully with', chart.data.datasets.length, 'datasets');
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
